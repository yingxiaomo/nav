name: CI — Test & Lint

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "refactor/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          # 与 Dockerfile、本地开发保持同一 Node 大版本（自带 npm 11）：
          # 不提交 lockfile 的策略下，依赖树每次全新解析，npm 10.x 的
          # arborist 存在 edgesOut 崩溃 bug（CI 曾因此全红）
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build

  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./cmd/nav-server
      - run: go test ./...
