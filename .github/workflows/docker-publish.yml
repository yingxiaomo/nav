name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "dev", "feat/merge-server", "refactor/go-rewrite" ]
    tags: [ "v*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 质量门禁：测试不过不发布（发布此前与测试是两个独立 workflow，红测照发）
  test:
    name: Quality gate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  all-in-one:
    name: All-in-one image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/yingxiaomo/nav
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,suffix=,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Clean up old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="nav"
          KEEP=10
          # 永远保留这些 tag 的版本，避免误删常用镜像
          PROTECT="latest main refactor-go-rewrite feat-merge-server"
          echo "检查 $OWNER/$PACKAGE 的版本（保留最新 $KEEP 个 + 受保护 tag）..."
          # 用户级包 API：ghcr.io/{owner}/nav 是用户包，不是 repo 级
          VERSIONS=$(gh api --paginate "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            --jq '.[] | [.created_at, .id] | @tsv' 2>/dev/null | sort || true)
          if [ -z "$VERSIONS" ]; then echo "无版本记录，跳过清理"; exit 0; fi
          COUNT=$(echo "$VERSIONS" | wc -l)
          echo "当前版本数: $COUNT"
          if [ "$COUNT" -gt "$KEEP" ]; then
            echo "$VERSIONS" | head -n "$((COUNT-KEEP))" | while read -r _ ID; do
              TAGS=$(gh api "/users/$OWNER/packages/container/$PACKAGE/versions/$ID" \
                --jq '.metadata.container.tags // [] | .[]' 2>/dev/null | tr '\n' ' ')
              SKIP=""
              for t in $PROTECT; do echo "$TAGS" | grep -qw "$t" && SKIP=1; done
              if [ -n "$SKIP" ]; then
                echo "跳过受保护版本 ID=$ID (tags: $TAGS)"
              elif gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$ID?force=true" 2>/dev/null; then
                echo "已删除 ID=$ID"
              else
                echo "删除失败 ID=$ID"
              fi
            done
            echo "清理完成"
          else
            echo "版本数未超限，跳过清理"
          fi

